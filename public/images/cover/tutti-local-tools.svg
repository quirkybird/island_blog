<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Tutti 架构封面：一个 daemon 连接 Claude Code、Codex、ACP Agent 与本地工具">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#161c26" stroke-width="1" />
    </pattern>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f8fd0" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#2f8fd0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hubFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172231" />
      <stop offset="100%" stop-color="#111925" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0e1118" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- 品牌 -->
  <g transform="translate(80 74)">
    <rect width="14" height="14" rx="3" fill="#38bdf8" />
    <text x="26" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.4" fill="#93a0b4">TUTTI</text>
  </g>

  <!-- 左侧标题 -->
  <text x="80" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2.6" fill="#5f6b7d">SOURCE WALKTHROUGH</text>
  <text x="78" y="272" font-family="'PingFang SC','Hiragino Sans GB','Source Han Sans SC',system-ui,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" fill="#f3f1ea">不止 Claude Code</text>
  <text x="80" y="332" font-family="'PingFang SC','Hiragino Sans GB','Source Han Sans SC',system-ui,sans-serif" font-size="21" fill="#98a3b5">一个 daemon 如何接入所有</text>
  <text x="80" y="366" font-family="'PingFang SC','Hiragino Sans GB','Source Han Sans SC',system-ui,sans-serif" font-size="21" fill="#98a3b5">本地 Agent 与工具</text>

  <rect x="80" y="412" width="64" height="3" rx="1.5" fill="#38bdf8" />
  <text x="80" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="0.6" fill="#6d7a8e">claude_sdk / app-server / ACP</text>
  <text x="80" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" letter-spacing="0.6" fill="#6d7a8e">browser / computer / connector</text>

  <!-- 右侧：hub 与四个接入面 -->
  <circle cx="878" cy="336" r="250" fill="url(#hubGlow)" />

  <g stroke="#26374c" stroke-width="1.4" fill="none">
    <path d="M878 336 L660 158" />
    <path d="M878 336 L1096 158" />
    <path d="M878 336 L660 528" />
    <path d="M878 336 L1096 528" />
  </g>
  <g>
    <circle cx="770" cy="248" r="3.2" fill="#38bdf8" />
    <circle cx="986" cy="248" r="3.2" fill="#a78bfa" />
    <circle cx="770" cy="430" r="3.2" fill="#4ade80" />
    <circle cx="986" cy="430" r="3.2" fill="#f0b46a" />
  </g>

  <!-- 节点 -->
  <g font-family="'PingFang SC','Hiragino Sans GB',system-ui,sans-serif">
    <g transform="translate(550 119)">
      <rect width="220" height="78" rx="14" fill="#121822" stroke="#243044" />
      <rect x="0" y="16" width="3" height="46" rx="1.5" fill="#38bdf8" />
      <text x="18" y="34" font-size="15" font-weight="600" fill="#e8eef8">Claude Code</text>
      <text x="18" y="56" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7f8da2">claude_sdk · NDJSON</text>
    </g>
    <g transform="translate(986 119)">
      <rect width="220" height="78" rx="14" fill="#121822" stroke="#243044" />
      <rect x="0" y="16" width="3" height="46" rx="1.5" fill="#a78bfa" />
      <text x="18" y="34" font-size="15" font-weight="600" fill="#e8eef8">Codex / Tutti Agent</text>
      <text x="18" y="56" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7f8da2">app-server · JSON-RPC</text>
    </g>
    <g transform="translate(550 489)">
      <rect width="220" height="78" rx="14" fill="#121822" stroke="#243044" />
      <rect x="0" y="16" width="3" height="46" rx="1.5" fill="#4ade80" />
      <text x="18" y="34" font-size="15" font-weight="600" fill="#e8eef8">ACP Agents</text>
      <text x="18" y="56" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7f8da2">Cursor · OpenCode · OpenClaw</text>
    </g>
    <g transform="translate(986 489)">
      <rect width="220" height="78" rx="14" fill="#121822" stroke="#243044" />
      <rect x="0" y="16" width="3" height="46" rx="1.5" fill="#f0b46a" />
      <text x="18" y="34" font-size="15" font-weight="600" fill="#e8eef8">Local Capabilities</text>
      <text x="18" y="56" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#7f8da2">browser · computer · MCP</text>
    </g>
  </g>

  <!-- 中心 daemon -->
  <g transform="translate(768 280)">
    <rect width="220" height="112" rx="20" fill="url(#hubFill)" stroke="#2f7fb8" stroke-width="1.4" />
    <text x="24" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700" fill="#eaf4ff">tuttid</text>
    <text x="24" y="76" font-family="'PingFang SC','Hiragino Sans GB',system-ui,sans-serif" font-size="12" fill="#8aa6c2">Agent Host · Runtime</text>
    <circle cx="186" cy="28" r="4" fill="#4ade80" />
  </g>

  <text x="1120" y="632" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" letter-spacing="0.8" fill="#4e5b6d">7 providers · 3 runtime kinds · 1 aggregate connector</text>
</svg>
